# Spring Boot Configuration
spring.application.name=institute-api

# MySQL Database (same as original CodeIgniter config)
spring.datasource.url=jdbc:mysql://localhost:3306/institute_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Server
server.port=8081
server.error.include-message=always
server.error.include-stacktrace=never

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload directory
app.upload.dir=${user.dir}/uploads

# CORS
app.cors.allowed-origins=http://localhost:4200,http://localhost:4300

# Multi-Tenant Header
app.tenant.header=X-Tenant-ID
app.tenant.default=default
