# Spring Boot Configuration
spring.application.name=institute-api

# MySQL Database (same as original CodeIgniter config)
spring.datasource.url=jdbc:mysql://localhost:3306/institute_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# Server
server.port=8081
server.error.include-message=always
server.error.include-stacktrace=never

# File Upload
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Upload directory
app.upload.dir=${user.dir}/uploads

# CORS
app.cors.allowed-origins=http://localhost:4200,http://localhost:4300

# Multi-Tenant Header (legacy fallback)
app.tenant.header=X-Tenant-ID
app.tenant.default=default

# App Domain for subdomain resolution (e.g., classivo.app for *.classivo.app subdomains)
# For local dev, use 'localhost' — subdomains work as: abcschool.localhost:8081
app.domain=localhost

# JWT
app.jwt.secret=change_this_secret_in_production_please_change_now_1234567890
app.jwt.expiration-minutes=720

# Rate limiting
app.ratelimit.enabled=true
app.ratelimit.capacity=120
app.ratelimit.refill-seconds=60

# TEMP: Disable password checks (set false in production)
app.auth.disable-password-check=true
