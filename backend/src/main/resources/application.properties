# ===================================================================
# CLASSIVO INSTITUTE API - HOSTING & DEPLOYMENT CONFIGURATION
#
# Easily change host / domain / database when deploying to production!
# Option 1: Edit the variables below directly.
# Option 2: Set Environment Variables on your server (DB_HOST, APP_DOMAIN, DB_USER, etc.)
# ===================================================================

# --- 1. Database Configuration ---
app.db.host=${DB_HOST:localhost}
app.db.port=${DB_PORT:3306}
app.db.name=${DB_NAME:institute_db}
app.db.username=${DB_USER:root}
app.db.password=${DB_PASS:muthu}
app.db.params=${DB_PARAMS:?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.url=jdbc:mysql://${app.db.host}:${app.db.port}/${app.db.name}${app.db.params}
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- 2. Server & Domain Configuration ---
server.port=${SERVER_PORT:8081}
spring.application.name=institute-api

# Application Domain (e.g., localhost for dev, classivo.app or your-domain.com for production)
app.domain=${APP_DOMAIN:localhost}

# Local IP or Secondary Host IP (for LAN dev / testing)
app.host.ip=${APP_HOST_IP:localhost}

# CORS Allowed Origins (Comma-separated)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300,http://127.0.0.1:4200,http://127.0.0.1:4300,http://${app.host.ip}:4200,http://${app.host.ip}:4300,http://${app.domain}:4200,http://${app.domain}:4300}

# --- 3. JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# --- 4. Server Error Output ---
server.error.include-message=always
server.error.include-stacktrace=never

# --- 5. File Upload & Storage ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:${user.dir}/uploads}

# --- 6. Multi-Tenant Configuration ---
app.tenant.header=X-Tenant-ID
app.tenant.default=default

# --- 7. Security & JWT Settings ---
app.jwt.secret=${JWT_SECRET:change_this_secret_in_production_please_change_now_1234567890}
app.jwt.expiration-minutes=720

# Rate limiting
app.ratelimit.enabled=true
app.ratelimit.capacity=5000
app.ratelimit.refill-seconds=60

# TEMP: Disable password checks (set false in production)
app.auth.disable-password-check=true

# --- 8. Google Drive Service Account ---
# Path to the Google Service Account JSON key file.
# Download this from Google Cloud Console > IAM & Admin > Service Accounts > Keys.
# Share your Google Drive folder with the service account email (Editor access).
app.gdrive.credentials-path=${GDRIVE_CREDENTIALS:./gdrive-credentials.json}
