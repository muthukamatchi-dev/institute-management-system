<div class=m-page><div class=m-profile-header><div class=m-profile-avatar>{{ user?.name?.charAt(0)?.toUpperCase() || '?' }}</div><h2 class=m-profile-name>{{ user?.name || 'User' }}</h2><p class=m-profile-role>{{ user?.role_name || user?.role || 'User' }}</p></div><div class=m-profile-section><div class=m-detail-row><span class=m-lbl>📧 Email</span><span class=m-val>{{ user?.email || '—' }}</span></div><div class=m-detail-row><span class=m-lbl>🏷️ Role</span><span class=m-val>{{ user?.role_name || user?.role || '—' }}</span></div></div></div>
<style>.m-page{padding:16px;padding-bottom:80px}.m-profile-header{text-align:center;padding:24px 16px;margin-bottom:16px}.m-profile-avatar{width:72px;height:72px;border-radius:20px;background:rgb(var(--color-primary-600));color:white;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}.m-profile-name{font-size:22px;font-weight:900;color:#0f172a;margin:0}:host-context(.dark) .m-profile-name{color:white}.m-profile-role{font-size:13px;font-weight:700;color:#64748b;text-transform:capitalize;margin:4px 0 0}.m-profile-section{background:white;border-radius:16px;padding:4px 14px;border:1px solid rgba(0,0,0,.04)}:host-context(.dark) .m-profile-section{background:#1e293b;border-color:rgba(255,255,255,.04)}.m-detail-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(0,0,0,.04)}:host-context(.dark) .m-detail-row{border-bottom-color:rgba(255,255,255,.04)}.m-detail-row:last-child{border-bottom:none}.m-lbl{font-size:12px;font-weight:700;color:#94a3b8}.m-val{font-size:13px;font-weight:700;color:#0f172a;text-align:right}:host-context(.dark) .m-val{color:white}</style>
