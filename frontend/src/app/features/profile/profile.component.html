<div class="max-w-4xl mx-auto space-y-6">
    <div
        class="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-soft dark:shadow-none border border-slate-100 dark:border-slate-800 overflow-hidden">
        <!-- Profile Header -->
        <div class="h-48 bg-gradient-to-r from-primary-600 to-indigo-600 relative">
            <div class="absolute -bottom-16 left-10 p-1 bg-white dark:bg-slate-900 rounded-[2rem] shadow-xl">
                <img [src]="'https://ui-avatars.com/api/?name=' + (user?.name || 'Admin') + '&size=256&background=f8fafc&color=0D8ABC'"
                    class="w-32 h-32 rounded-[1.8rem] object-cover" alt="Profile avatar">
            </div>
        </div>

        <div class="pt-20 px-10 pb-10">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <h1 class="text-3xl font-black text-slate-800 dark:text-white">{{ user?.name }}</h1>
                    <p
                        class="text-slate-500 dark:text-slate-400 font-bold mt-1 uppercase tracking-widest text-sm italic">
                        {{ user?.role_name
                        }}</p>
                </div>
                <div class="flex gap-3">
                    <button (click)="saveProfile()" [disabled]="loading"
                        class="px-8 py-2.5 bg-primary-600 text-white font-black rounded-xl shadow-lg shadow-primary-200 dark:shadow-none hover:bg-primary-700 transition-all text-xs uppercase tracking-widest outline-none disabled:opacity-50">
                        {{ loading ? 'Saving...' : 'Save Changes' }}
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mt-12">
                <div class="space-y-6">
                    <h3 class="text-lg font-black text-slate-800 dark:text-slate-200 flex items-center gap-2">
                        <span
                            class="w-8 h-8 rounded-lg bg-primary-50 dark:bg-primary-900/20 text-primary-600 dark:text-primary-400 flex items-center justify-center text-sm">👤</span>
                        Personal Information
                    </h3>

                    <div class="space-y-4">
                        <div>
                            <label
                                class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Full
                                Name</label>
                            <input type="text" [(ngModel)]="profileData.name"
                                class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-slate-800 dark:text-white font-bold focus:ring-4 focus:ring-primary-500/10 transition-all outline-none">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Email
                                Address</label>
                            <input type="email" [(ngModel)]="profileData.email"
                                class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-slate-800 dark:text-white font-bold focus:ring-4 focus:ring-primary-500/10 transition-all outline-none">
                        </div>
                    </div>
                </div>

                <div class="space-y-6">
                    <h3 class="text-lg font-black text-slate-800 dark:text-slate-200 flex items-center gap-2">
                        <span
                            class="w-8 h-8 rounded-lg bg-amber-50 dark:bg-amber-900/20 text-amber-600 dark:text-amber-400 flex items-center justify-center text-sm">🔑</span>
                        Security Settings
                    </h3>

                    <div class="space-y-4">
                        <div>
                            <label
                                class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 ml-1">Current
                                Password</label>
                            <input type="password" placeholder="••••••••" [(ngModel)]="profileData.currentPassword"
                                class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-slate-800 dark:text-white font-bold focus:ring-4 focus:ring-primary-500/10 transition-all outline-none">
                        </div>
                        <div>
                            <label
                                class="block text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest mb-1.5 ml-1">New
                                Password</label>
                            <input type="password" placeholder="Enter new password"
                                [(ngModel)]="profileData.newPassword"
                                class="w-full px-5 py-3.5 bg-slate-50 dark:bg-slate-800 border-none rounded-2xl text-slate-800 dark:text-white font-bold focus:ring-4 focus:ring-primary-500/10 transition-all outline-none">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
