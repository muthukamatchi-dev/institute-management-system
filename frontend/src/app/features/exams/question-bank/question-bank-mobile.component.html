<!-- Mobile Question Bank Template -->
<div class="m-question-bank p-3 pb-24 space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-slate-800 dark:text-white">Question Bank</h2>
      <p class="text-xs text-slate-500">Repository of test templates</p>
    </div>
    <button (click)="openCreateModal()" class="px-3.5 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs shadow-md">
      + Add Paper
    </button>
  </div>

  <input type="text" [(ngModel)]="templateSearchTerm" placeholder="Search paper templates..." 
         class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white shadow-sm">

  <div class="space-y-3">
    <div *ngFor="let item of filteredTemplates" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 space-y-2">
      <div class="flex justify-between items-start">
        <h3 class="font-bold text-slate-800 dark:text-white text-sm">{{ item.title }}</h3>
        <span class="text-xs text-slate-400 font-bold">{{ item.questions?.length || 0 }} Qs</span>
      </div>
      <p class="text-xs text-slate-500">{{ item.subject || 'General' }}</p>
    </div>
    <div *ngIf="filteredTemplates.length === 0" class="text-center py-6 text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-xl">
      No question papers found.
    </div>
  </div>
</div>
