<!-- Mobile Exam Entries Template -->
<div class="m-exam-entries p-3 pb-24 space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-slate-800 dark:text-white">Exam Entries</h2>
      <p class="text-xs text-slate-500">Student hall tickets & marks entry</p>
    </div>
    <button (click)="openCreateModal()" class="px-3.5 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs shadow-md">
      + New Entry
    </button>
  </div>

  <input type="text" [(ngModel)]="entrySearchTerm" placeholder="Search exam entries..." 
         class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white shadow-sm">

  <div class="space-y-3">
    <div *ngFor="let entry of filteredEntries" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 space-y-2">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="font-bold text-slate-800 dark:text-white text-sm">{{ entry.title }}</h3>
          <p class="text-xs text-slate-500">{{ entry.exam_date | date:'dd-MM-yyyy' }}</p>
        </div>
        <span class="px-2.5 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold">
          {{ entry.total_marks }} Marks
        </span>
      </div>
    </div>
    <div *ngIf="filteredEntries.length === 0" class="text-center py-6 text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-xl">
      No exam entries found.
    </div>
  </div>
</div>
