<!-- Mobile Login Template -->
<div class="mobile-login-container">
  <!-- Background effects -->
  <div class="mobile-login-bg">
    <div class="mobile-login-orb mobile-login-orb-1"></div>
    <div class="mobile-login-orb mobile-login-orb-2"></div>
  </div>

  <div class="mobile-login-content">
    <!-- Logo & Branding -->
    <div class="mobile-login-brand">
      <div class="mobile-login-logo">
        <span>{{ tenantName?.charAt(0)?.toUpperCase() || 'C' }}</span>
      </div>
      <h1 class="mobile-login-title">{{ tenantName }}</h1>

      <div *ngIf="tenantLoading" class="mobile-login-skeleton">
        <div class="mobile-skeleton-bar"></div>
      </div>
    </div>

    <!-- Error -->
    <div *ngIf="tenantError" class="mobile-login-error-banner">
      <span>⚠️</span>
      <p>{{ tenantError }}</p>
    </div>

    <!-- Login Form -->
    <form *ngIf="!tenantError" (ngSubmit)="onLogin()" class="mobile-login-form">
      <div class="mobile-input-group">
        <label class="mobile-input-label">Email or Username</label>
        <div class="mobile-input-wrap">
          <span class="mobile-input-icon">📧</span>
          <input
            type="text"
            [(ngModel)]="email"
            name="email"
            placeholder="Enter your email"
            class="mobile-input"
            autocomplete="username"
            required>
        </div>
      </div>

      <div class="mobile-input-group">
        <label class="mobile-input-label">Password</label>
        <div class="mobile-input-wrap">
          <span class="mobile-input-icon">🔒</span>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            class="mobile-input"
            autocomplete="current-password"
            required>
        </div>
      </div>

      <div *ngIf="error" class="mobile-login-error">
        <span>❌</span> {{ error }}
      </div>

      <button type="submit" [disabled]="loading" class="mobile-login-btn">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="mobile-login-spinner">⟳</span>
      </button>
    </form>

    <!-- Find Institute (main domain only) -->
    <button *ngIf="isMainDomain" (click)="goToFindInstitute()" class="mobile-find-institute-btn">
      🔍 Find Your Institute
    </button>
  </div>
</div>
