<!-- Mobile Study Material Template -->
<div class="m-study-material p-3 pb-24 space-y-4">
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-slate-800 dark:text-white">Study Material</h2>
      <p class="text-xs text-slate-500">Documents, notes & assignments</p>
    </div>
    <button (click)="openAddModal()" class="px-3.5 py-2 bg-indigo-600 text-white rounded-xl font-bold text-xs shadow-md">
      + Upload
    </button>
  </div>

  <!-- Search -->
  <input type="text" [(ngModel)]="materialSearchTerm" placeholder="Search materials..." 
         class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-white shadow-sm">

  <!-- List Cards -->
  <div class="space-y-3">
    <div *ngFor="let item of filteredMaterials" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 space-y-2">
      <div class="flex items-start gap-3">
        <span class="text-3xl">📄</span>
        <div class="flex-1 min-w-0">
          <h3 class="font-bold text-slate-800 dark:text-white text-sm truncate">{{ item.title }}</h3>
          <p class="text-xs text-slate-500 line-clamp-1">{{ item.description || 'No description' }}</p>
          <div class="flex gap-2 text-[10px] text-slate-400 mt-1">
            <span>Course: {{ item.courseName || 'All' }}</span>
          </div>
        </div>
      </div>
      <div class="flex gap-2 pt-2 border-t border-slate-100 dark:border-slate-700/50 justify-end">
        <button (click)="viewMaterial(item)" class="px-3 py-1.5 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-lg text-xs font-bold">
          👀 Preview
        </button>
        <button (click)="deleteMaterial(item.id)" class="px-3 py-1.5 bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 rounded-lg text-xs font-bold">
          Delete
        </button>
      </div>
    </div>
    <div *ngIf="filteredMaterials.length === 0" class="text-center py-6 text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-xl">
      No study materials found.
    </div>
  </div>
</div>
