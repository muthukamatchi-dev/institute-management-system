<!-- Mobile Staff Schedule -->
<div class="m-page p-3 pb-24 space-y-4">
  <div class="m-header-section">
    <h2 class="text-xl font-bold text-slate-800 dark:text-white">Teaching Schedule</h2>
    <p class="text-xs text-slate-500">View & plan daily topics</p>
  </div>

  <div class="flex items-center justify-between bg-white dark:bg-slate-800 p-2 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
    <button (click)="changeDate(-1)" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-xs font-bold">◀</button>
    <input type="date" [(ngModel)]="selectedDate" (change)="loadSchedule()" class="bg-transparent text-xs font-bold text-slate-800 dark:text-white border-none text-center">
    <button (click)="changeDate(1)" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-xs font-bold">▶</button>
  </div>

  <div class="space-y-3">
    <div *ngFor="let s of schedule" class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 space-y-2">
      <div class="flex justify-between items-start">
        <h3 class="font-bold text-slate-800 dark:text-white text-base">{{ s.batch_name || s.student_name }}</h3>
        <span class="px-2.5 py-1 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-full text-xs font-bold">
          {{ s.start_time }} - {{ s.end_time }}
        </span>
      </div>
      <p class="text-xs text-slate-500 line-clamp-2">{{ s.topic || 'No topic set' }}</p>
    </div>
    <div *ngIf="schedule.length === 0" class="text-center py-6 text-slate-400 text-xs bg-white dark:bg-slate-800 rounded-xl">
      No classes scheduled for this date.
    </div>
  </div>
</div>
