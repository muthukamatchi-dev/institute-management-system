<!-- Mobile Staff My Attendance -->
<div class="m-page p-3 pb-24 space-y-4">
  <div class="m-header-section">
    <h2 class="text-xl font-bold text-slate-800 dark:text-white">My Attendance</h2>
    <p class="text-xs text-slate-500">Record daily check-in / check-out</p>
  </div>

  <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 space-y-3">
    <div class="flex justify-between items-center">
      <span class="text-xs font-bold text-slate-400 uppercase">Live Time</span>
      <span class="text-lg font-mono font-bold text-slate-800 dark:text-white">{{ currentTime }}</span>
    </div>

    <div class="flex gap-2 pt-2 border-t border-slate-100 dark:border-slate-700/50">
      <button (click)="savePunch('login')" [disabled]="saving || attendanceRecord?.loginTime" 
              class="flex-1 py-3 bg-indigo-600 disabled:opacity-50 text-white rounded-xl font-bold text-xs shadow-md">
        {{ attendanceRecord?.loginTime ? 'Punched In ✓' : 'Punch In 🌅' }}
      </button>
      <button (click)="savePunch('logout')" [disabled]="saving || !attendanceRecord?.loginTime || attendanceRecord?.logoutTime" 
              class="flex-1 py-3 bg-rose-600 disabled:opacity-50 text-white rounded-xl font-bold text-xs shadow-md">
        {{ attendanceRecord?.logoutTime ? 'Punched Out ✓' : 'Punch Out 🌙' }}
      </button>
    </div>
  </div>
</div>
